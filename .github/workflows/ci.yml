name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          node tools/commit-message.ts --range "$base..$head"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      # Since Electron 42 the binary is downloaded on the first run of its `bin` script and
      # no longer by a postinstall hook. It is cached and fetched explicitly, so no job ever
      # pulls a hundred megabytes twice and no run downloads it behind a test.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      - working-directory: source
        run: pnpm typecheck
      - working-directory: source
        run: pnpm lint
      - working-directory: source
        run: pnpm fmt:check
      # The stories run as tests in a headless Chromium that Playwright downloads on demand; it
      # is cached like the Electron binary so no run fetches a browser twice.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}
      - name: Fetch the Playwright browser
        working-directory: source/packages/ui
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      # The suites that need a window are not run here: a runner has no display server and no
      # GPU, and what this lot proves about a window is proved on a real target. The stories
      # run headless, which is a page and not a window.
      #
      # The step is capped: a suite that hangs fails this in twenty minutes rather than in the
      # fifty a Windows job once sat for, and the suites' own timeouts catch what really stalls
      # (#99).
      - name: Test
        working-directory: source
        timeout-minutes: 20
        run: pnpm test

      # Temporary (#253): what the runner is, what a process costs on it, and where a test's time goes.
      - name: Diagnostics · runner
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled | Format-List
          "Exclusions: $((Get-MpPreference).ExclusionPath -join ', ')"
          "TEMP: $env:TEMP"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table
      - name: Diagnostics · process and git costs
        if: always()
        continue-on-error: true
        working-directory: source
        run: node .github/diagnostics/bench.mjs 15
      - name: Diagnostics · the repository project alone, traced
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        working-directory: source
        shell: bash
        env:
          HEMERA_SPAWN_TRACE: ${{ runner.temp }}/trace-alone
        run: |
          mkdir -p "$HEMERA_SPAWN_TRACE"
          node .github/diagnostics/cpu.mjs "$HEMERA_SPAWN_TRACE/cpu.txt" &
          status=0
          pnpm exec vp test run --project repository --reporter=verbose --reporter=json --outputFile.json="$HEMERA_SPAWN_TRACE/vitest.json" || status=$?
          kill %1
          exit $status
      - name: Diagnostics · every project, traced
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        working-directory: source
        shell: bash
        env:
          HEMERA_SPAWN_TRACE: ${{ runner.temp }}/trace-full
        run: |
          mkdir -p "$HEMERA_SPAWN_TRACE"
          node .github/diagnostics/cpu.mjs "$HEMERA_SPAWN_TRACE/cpu.txt" &
          status=0
          pnpm exec vp test run --reporter=default --reporter=json --outputFile.json="$HEMERA_SPAWN_TRACE/vitest.json" || status=$?
          kill %1
          exit $status
      - name: Diagnostics · Defender excludes the folders, then the costs again
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: source
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess git.exe, node.exe
          node .github/diagnostics/bench.mjs 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/trace-*

  # The beta is the application the user runs every day, and it is built from every push to the
  # integration branch (design D3-10). It carries no tag: its version is what the repository
  # answers about itself, which is why the history is fetched whole rather than shallow.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      # `CI` is set by GitHub, and it is what the packaging refuses to build a beta without.
      - working-directory: source
        run: pnpm package --channel beta

      - uses: actions/upload-artifact@v4
        with:
          name: hemera-beta-${{ runner.os }}
          path: source/dist/package
          if-no-files-found: error

  # The beta is a single rolling pre-release: it moves with `dev`, it is not a version, and its
  # tag is deleted and recreated on every push so `beta` always points at the latest build.
  prerelease:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hemera-beta-*
          merge-multiple: true
          path: dist/package

      # One pre-release per build, and every one of them stays: the tag is the beta's own
      # version (`beta-0.0.0-<sha>`, then `beta-0.4.0-3-g<sha>` once main is tagged), so two
      # betas never share a name and an older one can be installed again from the Releases page.
      - name: Publish the beta as its own pre-release
        working-directory: dist/package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The file is "Hemera Beta-<version>-win.zip" on disk, with a space GitHub shows as a dot.
          version="$(ls *.zip | head -1 | sed -E 's/^Hemera[ .]Beta-(.*)-win\.zip$/\1/')"
          tag="beta-${version}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Hemera Beta ${version}" \
            --notes "Beta built from dev at ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Every beta is kept; the newest pre-release is the current one." \
            *.zip *.AppImage *.deb
