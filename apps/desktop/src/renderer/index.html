<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hemera</title>
    <script>
      // Before anything is drawn: the page wears what the system asks for, so a cold start
      // never shows a pale page inside a dark frame. The store takes over once React is up.
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- The start screen of @hemera/ui (shell/start-screen.tsx), written out so it is on the
           first frame: the application draws the same one until its first page is ready. -->
      <div class="flex h-screen items-center justify-center bg-background text-muted-foreground">
        <span role="status" aria-label="Starting Hemera" class="relative size-icon-lg">
          <span class="absolute inset-0 flex items-center justify-center motion-safe:animate-turn">
            <span class="absolute rounded-full bg-current size-1.5 orbit-0"></span>
            <span class="absolute rounded-full bg-current size-1.5 orbit-1"></span>
            <span class="absolute rounded-full bg-current size-1.5 orbit-2"></span>
          </span>
        </span>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
