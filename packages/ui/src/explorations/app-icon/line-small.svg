      <stop offset="0" stop-color="#1c1c24"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="44" y="44" width="936" height="936" rx="212" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="24"/>
  <g transform="translate(512 512) scale(26) translate(-16 -16.05)" fill="none" stroke="#f0abfc" stroke-linecap="round" stroke-linejoin="round">
