<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- B · Line. The face as a line mark on a dark tile: one light stroke for the head, the same
       stroke for the eyes and the mouth, lit in the fuchsia of the dark theme as a screen is. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c24"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>
  <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="232" y="252" width="560" height="520" rx="150" stroke-width="36"/>
    <g transform="translate(512 512) scale(15) translate(-16 -16.05)" stroke-width="2.4">
      <path d="M4.8 10.4L9.2 14.7L13.6 10.4"/>
      <path d="M18.4 10.4L22.8 14.7L27.2 10.4"/>
      <path d="M13.2 22H18.8"/>
    </g>
  </g>
  <use href="#mark" stroke="#d946ef" opacity="0.55" filter="url(#glow)"/>
  <use href="#mark" stroke="#f5d0fe"/>
</svg>
