<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- C · Monogram, drawn for 16 to 32 px: the stems move out to the edge of the tile and the eyes
       grow into the room it leaves, or the counter closes over them. -->
