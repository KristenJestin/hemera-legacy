<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A · Tile, drawn for 16 to 32 px: the tile fills more of the square, the face is larger and
       its strokes heavier, so each one is still more than a pixel wide at 16. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <g transform="translate(512 512) scale(26) translate(-16 -16.05)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.8 10.4L9.2 14.7L13.6 10.4" stroke-width="3.5"/>
    <path d="M18.4 10.4L22.8 14.7L27.2 10.4" stroke-width="3.5"/>
    <path d="M13.2 22H18.8" stroke-width="3.2"/>
  </g>
</svg>
